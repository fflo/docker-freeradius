name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --pull --no-cache -t fflo/freeradius .

      - name: Inspect image
        run: docker inspect fflo/freeradius

      - name: Run tests
        run: ./scripts/run-tests.sh
